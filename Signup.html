<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - STACKLY</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-layout {
            min-height: 100vh;
            display: flex;
            background: linear-gradient(135deg, var(--color-background) 50%, #e6f0eb 100%);
            position: relative;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .back-to-home {
            position: absolute;
            top: 2rem;
            left: 2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 10;
        }

        .brand-logo-right {
            position: absolute;
            top: 2rem;
            right: 2rem;
            height: 30px;
            z-index: 10;
        }

        .auth-card {
            background: #fff;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 5;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-family: var(--font-primary);
            font-size: 2rem;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: #666;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--color-primary);
        }

        .form-control {
            width: 100%;
            padding: 1rem 1rem 1rem 2.5rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: var(--font-primary);
            font-size: 1rem;
            transition: var(--transition-smooth);
            background: #fff;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--color-primary);
        }
        
        .select-control {
            padding: 1rem 1rem 1rem 2.5rem;
            appearance: none;
        }

        .input-icon {
            position: absolute;
            bottom: 16px;
            left: 14px;
            color: #999;
        }
        
        .eye-icon {
            position: absolute;
            bottom: 16px;
            right: 14px;
            color: #999;
            cursor: pointer;
        }

        .btn-auth {
            width: 100%;
            padding: 1rem;
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: var(--transition-smooth);
        }

        .btn-auth:hover {
            background: var(--color-accent);
        }

        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #666;
        }

        .auth-footer a {
            color: var(--color-primary);
            font-weight: 700;
        }
        
        .error-msg {
            color: #d9534f;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: none;
        }

        .shape-1 {
            position: absolute;
            top: 0; left: 0; width: 50%; height: 100%;
            background: #f0f0f0;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 0% 100%);
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="shape-1"></div>
    
    <a href="index.html" class="back-to-home">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>
    
    <img src="assets/Brand-logo.webp" alt="STACKLY" class="brand-logo-right">

    <div class="auth-layout">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Create an Account</h1>
                <p>Join STACKLY today</p>
            </div>
            
            <form id="signupForm">
                <div class="form-group">
                    <label>Sign Up As</label>
                    <i class="fas fa-user input-icon"></i>
                    <select id="role" class="form-control select-control">
                        <option value="Client">Client</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Full Name</label>
                    <i class="fas fa-user-tag input-icon"></i>
                    <input type="text" id="fullname" class="form-control" placeholder="John Doe">
                    <div class="error-msg" id="nameError">Please enter your full name.</div>
                </div>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" class="form-control" placeholder="user@example.com">
                    <div class="error-msg" id="emailError">Please enter a valid email.</div>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" class="form-control" placeholder="••••••••">
                    <i class="fas fa-eye eye-icon" id="togglePassword"></i>
                    <div class="error-msg" id="passwordError">Please enter a password (min 6 chars).</div>
                </div>
                
                <button type="submit" class="btn-auth">Sign Up</button>
            </form>
            
            <div class="auth-footer">
                Already have an account? <a href="Login.html">Login here</a>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        gsap.from(".auth-card", { y: 50, opacity: 0, duration: 1, ease: "power3.out" });
        gsap.from(".back-to-home", { x: -30, opacity: 0, duration: 0.8, delay: 0.5 });
        gsap.from(".brand-logo-right", { x: 30, opacity: 0, duration: 0.8, delay: 0.5 });
        
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');
        
        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });
        
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let isValid = true;
            
            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const pwd = document.getElementById('password').value;
            
            if(!fullname) {
                document.getElementById('nameError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('nameError').style.display = 'none';
            }
            
            if(!email || !email.includes('@')) {
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('emailError').style.display = 'none';
            }
            
            if(!pwd || pwd.length < 6) {
                document.getElementById('passwordError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('passwordError').style.display = 'none';
            }
            
            if(isValid) {
                document.querySelector('.btn-auth').innerText = 'Creating Account...';
                setTimeout(() => {
                    window.location.href = 'Login.html';
                }, 1500);
            }
        });
    </script>
</body>
</html>
